services:
  mariadb:
    image: mariadb:11.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: 123
      MARIADB_AUTO_UPGRADE: 1
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - haloerp-network

  redis-cache:
    image: redis:alpine
    networks:
      - haloerp-network

  redis-queue:
    image: redis:alpine
    networks:
      - haloerp-network

  frappe:
    image: frappe/bench:latest
    command: sleep infinity
    environment:
      - SHELL=/bin/bash
    ports:
      - "8000:8000"
      - "9000:9000"
    volumes:
      - .:/workspace/haloerp:cached
      - bench-data:/home/frappe/frappe-bench
    working_dir: /home/frappe/frappe-bench
    depends_on:
      - mariadb
      - redis-cache
      - redis-queue
    networks:
      - haloerp-network

networks:
  haloerp-network:
    name: haloerp-network

volumes:
  mariadb-data:
  bench-data:
